version: 2.1

jobs:
  tmp_node20-ship:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Mint sequence identifier
          command: |
            mkdir -p /tmp/data
            set +o pipefail 2>/dev/null; seq 1 951925 | sha256sum > /tmp/data/pt-C.pickle; true
            echo "ready: $(sha256sum /tmp/data/pt-C.pickle | cut -c1-16)..."
      - persist_to_workspace:
          root: /tmp/data
          paths:
            - pt-C.pickle
  node20-ship:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/data
      - run:
          name: Collect upstream
          command: |
            { cat /tmp/data/.ready > /dev/null; echo "read ok" ; } || true
      - run:
          name: Load source
          command: git clone --depth 1 --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore artifacts
          command: zcat bundle.tgz | tar xf -
      - run:
          name: Collect artifacts
          command: free -m
      - run:
          no_output_timeout: 70m
          command: env ./gateway
  bake_v9-beta:
